name: Build, Test, Stage, Prod Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # STAGE 1: BUILD
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify Python syntax
        run: python -m py_compile server.py

      - name: Package application files
        uses: actions/upload-artifact@v7
        with:
          name: robo-app-bundle
          path: |
            server.py
            index.html
            app.js
            explorations.js
            styles.css
            robo-icon.ico
            Procfile
            requirements.txt

  # STAGE 2: TEST (Runs only if Build succeeds)
  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: python -m unittest discover -s tests

  # STAGE 3: STAGE (Deploys automatically to Render Staging after Test passes)
  deploy-stage:
    needs: test
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: robo-app-bundle

      - name: Trigger Render Staging Deployment
        run: curl -f -X POST "${{ secrets.STAGE_DEPLOY_HOOK }}"

  # STAGE 4: PRODUCTION (Pauses for manual approval, then deploys to Render Prod)
  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: robo-app-bundle

      - name: Trigger Render Production Deployment
        run: curl -f -X POST "${{ secrets.PROD_DEPLOY_HOOK }}"
